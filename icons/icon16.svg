  <g fill="#3c4043">
    <rect x="3" y="3" width="1" height="10"/><rect x="6" y="3" width="1" height="10"/>
    <rect x="9" y="3" width="1" height="10"/><rect x="12" y="3" width="1" height="10"/>
  </g>
  <line x1="1.5" y1="11.5" x2="14.5" y2="4.5" stroke="#3c4043" stroke-width="1.4" stroke-linecap="round" shape-rendering="geometricPrecision"/>
</svg>
